name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Only what the unit tests import; torch/vLLM/transformers aren't needed and would slow CI down.
      - name: Install test dependencies
        run: pip install numpy pandas scikit-learn "pydantic>=2" python-dotenv pytest
      - name: Run tests
        run: pytest -q
